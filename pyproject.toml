[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kanban-ideas"
version = "0.1.0"
description = "Tableau Kanban Tkinter pour organiser des idées audio."
readme = "README.md"
authors = [{ name = "Kevin", email = "kevin@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.4",
]

[project.optional-dependencies]
dev = ["invoke>=2.2"]

[project.scripts]
kanban-ideas = "kanban_ideas.app:main"

[tool.setuptools.packages.find]
where = ["src"]
